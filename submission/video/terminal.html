<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>terminal</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0b0f14; color:#d7e3ee; font:30px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         width:1920px; height:1080px; display:flex; flex-direction:column; }
  #bar { background:#131c26; color:#9fb0c3; font-size:26px; padding:14px 28px;
         border-bottom:2px solid #2a3a4f; white-space:nowrap; overflow:hidden; }
  #bar b { color:#f5b942; }
  #term { flex:1; padding:28px 36px; overflow:hidden; white-space:pre-wrap; word-break:break-word; }
  .cmd { color:#57c785; }
  .agent { color:#5aa9ff; }
  .hot { color:#f5b942; }
  .dim { color:#8a99ab; }
  .verdict { color:#f5b942; font-weight:bold; }
  .caret { display:inline-block; width:18px; height:34px; margin-left:4px; vertical-align:-6px; background:#57c785;
           animation:blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #term div.new { animation:rise .35s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div id="bar"><b>●</b> <span id="title">terminal</span></div>
<div id="term"></div>
<script>
  window.__termDone = false;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  function paint(line) {
    const el = document.getElementById("term");
    const div = document.createElement("div");
    if (/^\$ /.test(line)) div.innerHTML = '<span class="cmd">' + esc(line) + "</span>";
    else if (/critic|objection|round 2|targeted_tasks|re-investigat/i.test(line))
      div.innerHTML = '<span class="hot">' + esc(line) + "</span>";
    else if (/verdict:|PASS|violation|receipt|nemotron/i.test(line))
      div.innerHTML = '<span class="verdict">' + esc(line) + "</span>";
    else if (/^\[/.test(line)) div.innerHTML = '<span class="agent">' + esc(line) + "</span>";
    else div.innerHTML = '<span class="dim">' + esc(line) + "</span>";
    div.classList.add("new");
    el.appendChild(div);
    return div;
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // modes: "play" fast replay, "type" types the command char by char then reveals lines one by one.
  window.termRun = async (mode, title, lines, lineMs = 260) => {
    window.__termDone = false;
    document.getElementById("title").textContent = title;
    const el = document.getElementById("term");
    el.innerHTML = "";
    for (const [i, line] of lines.entries()) {
      if (mode === "type" && i === 0) {
        const div = paint("");
        for (let n = 1; n <= line.length; n++) {
          div.innerHTML = '<span class="cmd">' + esc(line.slice(0, n)) + '</span><span class="caret"></span>';
          await wait(22);
        }
        div.innerHTML = '<span class="cmd">' + esc(line) + "</span>";
        await wait(350);
        continue;
      }
      paint(line);
      if (mode === "play") await wait(45);
      if (mode === "type") await wait(lineMs);
    }
    window.__termDone = true;
  };
</script>
</body>
</html>
