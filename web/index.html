<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteWhy</title>
<style>
:root {
  --paper: #f5f3eb; --paper-2: #ece9dd; --ink: #18272b; --ink-2: #4a5a5e; --rule: #d3cfc0;
  --accent: #c64d2e; --mist: #b7d8c7; --mist-ink: #24493a;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #141e21; --paper-2: #1c292d; --ink: #ece8dc; --ink-2: #a9b4b3; --rule: #33464b;
          --accent: #e0694a; --mist: #2e5a4a; --mist-ink: #cfe8db; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: inherit; text-underline-offset: 2px; }
.label { font: 11px/1.3 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
header { border-bottom: 1px solid var(--rule); padding: 16px 24px; }
.bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; max-width: 1440px; margin: 0 auto; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; margin-right: 8px; }
.brand small { display: block; font: 12px var(--mono); color: var(--ink-2); font-weight: 400; }
form { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; flex: 1 1 640px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.grow { flex: 1 1 280px; }
input, select, button { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--ink-2);
  border-radius: 4px; padding: 7px 10px; min-height: 36px; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=number] { width: 96px; }
button { background: var(--ink); color: var(--paper); border-color: var(--ink); cursor: pointer; font-weight: 600; }
button:disabled { opacity: .55; cursor: progress; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; max-width: 1440px; margin: 0 auto; padding: 24px; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
section + section { margin-top: 28px; }
h2 { font-size: 13px; font-family: var(--mono); font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
     color: var(--ink-2); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.empty { color: var(--ink-2); padding: 24px 0; }
.verdict { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding: 16px 18px; border-radius: 6px;
           border: 1px solid var(--ink); }
.verdict .v { font-size: 34px; font-weight: 750; letter-spacing: -.02em; line-height: 1.05; }
.verdict.no-go { background: var(--accent); border-color: var(--accent); color: #fff8f2; }
.verdict.go { background: var(--mist); border-color: var(--mist); color: var(--mist-ink); }
.verdict.needs_confirmation { border-style: dashed; }
.verdict .where { font-size: 14px; }
.why { font-size: 17px; line-height: 1.6; margin: 14px 0 0; max-width: 78ch; }
.guard { font: 12px var(--mono); color: var(--ink-2); margin-top: 8px; }
.layer + .layer { margin-top: 18px; }
.rule { border-top: 1px solid var(--rule); padding: 12px 0; }
.rule-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.rule-title { font-weight: 650; }
.grade { font: 600 11px/1 var(--mono); text-transform: uppercase; padding: 4px 6px; border-radius: 3px; border: 1px solid var(--ink-2); }
.grade.fatal { background: var(--accent); color: #fff8f2; border-color: var(--accent); }
.grade.major { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.applies { font: 12px var(--mono); color: var(--ink-2); }
.reason { margin: 6px 0; }
.computed { font: 12px/1.5 var(--mono); color: var(--ink-2); margin: 4px 0 8px; }
blockquote { margin: 6px 0; padding: 6px 10px; background: var(--paper-2); border-radius: 4px; font-size: 14px; }
blockquote .meta { display: block; font: 11px var(--mono); color: var(--ink-2); margin-top: 4px; }
.tag { font: 11px var(--mono); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--rule); }
.tag.verified { background: var(--mist); color: var(--mist-ink); border-color: var(--mist); }
.tag.not_found, .tag.unverifiable { border-style: dashed; }
.confirm li { margin-bottom: 8px; }
.confirm .q { color: var(--ink-2); font-size: 14px; }
aside { min-width: 0; }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.timeline li { display: grid; grid-template-columns: 28px 1fr; gap: 6px; padding: 6px 0; border-top: 1px solid var(--rule); }
.timeline .r { font: 11px var(--mono); color: var(--ink-2); padding-top: 2px; }
.timeline .who { font: 600 12px var(--mono); }
.timeline .what { color: var(--ink-2); overflow-wrap: anywhere; }
.status { font: 12px var(--mono); color: var(--ink-2); margin-bottom: 8px; min-height: 1.4em; }
table { width: 100%; border-collapse: collapse; font: 12px/1.4 var(--mono); }
th, td { text-align: left; padding: 4px 6px 4px 0; border-top: 1px solid var(--rule); vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--ink-2); font-weight: 600; }
.disclaimer { font-size: 12px; color: var(--ink-2); margin-top: 28px; }
@media (prefers-reduced-motion: no-preference) { .timeline li { animation: in .18s ease-out; } }
@keyframes in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">SiteWhy<small>US data center site screening, with the why</small></div>
    <form id="run-form">
      <div class="field grow"><label class="label" for="address">Site address</label>
        <input id="address" name="address" required value="13820 Pennsylvania Ave, Hagerstown, MD 21742" autocomplete="street-address"></div>
      <div class="field"><label class="label" for="mw">IT load (MW)</label>
        <input id="mw" name="mw" type="number" min="1" max="10000" step="1" value="300" required></div>
      <div class="field"><label class="label" for="permits">Permits submitted</label>
        <select id="permits" name="permits"><option value="">Unknown</option><option value="no">No</option><option value="yes">Yes</option></select></div>
      <button id="run-btn" type="submit">Screen site</button>
    </form>
    <div class="field"><label class="label" for="sample">Recorded runs</label>
      <select id="sample"><option value="">Open a recorded run</option></select></div>
  </div>
</header>
<main>
  <div id="report" aria-live="polite"><p class="empty">Enter a US address and planned IT load, or open a recorded run.</p></div>
  <aside>
    <section>
      <h2>Agent timeline</h2>
      <div class="status" id="run-status"></div>
      <ol class="timeline" id="timeline"></ol>
    </section>
    <section>
      <h2>Model trace (via Meterless Nightshift)</h2>
      <div id="models"><p class="empty">No requests yet.</p></div>
    </section>
    <section>
      <h2>Data trace (Zetaris)</h2>
      <div id="data"><p class="empty">No queries yet.</p></div>
    </section>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LAYERS = [["county", "County"], ["city", "City"], ["iso_rto", "Power market (ISO/RTO)"], ["state", "State"], ["federal", "Federal"]];
const VERDICT_TEXT = {"no-go": "No-go", "go": "Go", "conditional": "Conditional", "needs_confirmation": "Needs confirmation"};

function summarize(e) {
  const d = e.detail;
  switch (e.action) {
    case "resolved": return `${d.county}, ${d.state} · ${d.iso}${d.place ? " · " + d.place : " · unincorporated"}`;
    case "seeded": return `${d.local.length} local rule(s), ${d.curated.length} curated rule(s)`;
    case "tasks": case "targeted_tasks": return d.map((t) => `${t.rule_id}: ${t.questions.length} question(s)`).join("; ") || "no local rules";
    case "markovian_run": return `${d.rule} attempt ${d.attempt}: ${d.chunks} chunk(s), ${d.facts} fact(s), ${d.status}`;
    case "verified": return `${d.rule} attempt ${d.attempt}: ${d.checked - d.failed}/${d.checked} quotes verbatim`;
    case "retry_requested": return d;
    case "conflict": return `${d.rule} ${d.field}: ${d.value} vs ${d.other_primary ?? d.other_dataset}`;
    case "computed": return d.map((f) => `${f.rule_id}=${f.applies}`).join(", ");
    case "draft": return `verdict ${d.verdict}`;
    case "objections": return d.length ? d.map((o) => `${o.type} on ${o.rule_id}`).join("; ") : "no objections";
    case "escalated": return `${d.length} objection(s) need confirmation`;
    default: return typeof d === "string" ? d : JSON.stringify(d);
  }
}

function renderTimeline(events) {
  $("timeline").innerHTML = events.map((e) =>
    `<li><span class="r">R${esc(e.round)}</span><div><span class="who">${esc(e.role)}</span> <span class="label">${esc(e.action.replace(/_/g, " "))}</span><div class="what">${esc(summarize(e))}</div></div></li>`).join("");
}

function quoteHtml(ev) {
  const status = ev.verification;
  const src = ev.url && ev.url.startsWith("http") ? `<a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.provenance)} source</a>` : esc(ev.url || ev.provenance);
  return `<blockquote>“${esc(ev.quote)}”<span class="meta"><span class="tag ${esc(status)}">${esc(status)}</span> ${esc(ev.field ?? "")} · ${src}</span></blockquote>`;
}

function evidenceHtml(list) {
  const groups = new Map();
  for (const ev of list) {
    const key = ev.quote + "|" + ev.verification;
    const g = groups.get(key) || {...ev, fields: new Set()};
    if (ev.field) g.fields.add(ev.field.replace(/_/g, " "));
    groups.set(key, g);
  }
  const all = [...groups.values()].map((g) => ({...g, field: [...g.fields].join(", ")}));
  const shown = all.filter((g) => ["verified", "dataset"].includes(g.verification));
  const failed = all.length - shown.length;
  return shown.map(quoteHtml).join("") + (failed ? `<div class="computed">${failed} other quote(s) were rejected by the verifier (not verbatim in any source).</div>` : "");
}

function computedHtml(f) {
  const c = {...(f.computed || {})};
  if (f.parameters) Object.assign(c, f.parameters);
  const parts = Object.entries(c).filter(([, v]) => v !== null && typeof v !== "object")
    .map(([k, v]) => `${k}=${typeof v === "number" ? Math.round(v * 10) / 10 : v}`);
  if (c.generators) parts.push(`gensets=${c.generators.units}×${c.generators.unit_kw} kW (${c.generators.assumption})`);
  return parts.length ? `<div class="computed">${esc(parts.join("  ·  "))}</div>` : "";
}

function renderReport(r) {
  const j = r.jurisdiction || {};
  const byLayer = LAYERS.map(([key, name]) => [name, (r.findings || []).filter((f) => f.layer === key)]).filter(([, fs]) => fs.length);
  const confirm = r.needs_confirmation || [];
  $("report").innerHTML = `
    <section>
      <div class="verdict ${esc(r.verdict)}"><span class="v">${esc(VERDICT_TEXT[r.verdict] || r.verdict)}</span>
        <span class="where">${esc(r.project?.mw)} MW at ${esc(j.matched_address || r.project?.address)} · ${esc(j.county_name)}, ${esc(j.state)} · ${esc(j.iso)}</span></div>
      <p class="why">${esc(r.why)}</p>
      ${(r.guard_notes || []).length ? `<div class="guard">Checks applied by code: ${esc(r.guard_notes.join("; "))}</div>` : ""}
    </section>
    ${confirm.length ? `<section><h2>Needs confirmation (${confirm.length})</h2><ul class="confirm">${confirm.map((o) =>
      `<li><strong>${esc(o.rule_id)}</strong> <span class="tag">${esc(o.type.replace(/_/g, " "))}</span><br>${esc(o.text)}${o.question ? `<div class="q">To resolve: ${esc(o.question)}</div>` : ""}</li>`).join("")}</ul></section>` : ""}
    <section><h2>Rules by layer</h2>${byLayer.length ? byLayer.map(([name, fs]) => `<div class="layer"><div class="label">${esc(name)}</div>${fs.map((f) => `
      <div class="rule"><div class="rule-head"><span class="grade ${esc(f.grade)}">${esc(f.grade || "")}</span><span class="rule-title">${esc(f.title)}</span><span class="applies">applies: ${esc(f.applies)}</span></div>
        <p class="reason">${esc(f.reason)}</p>${computedHtml(f)}${evidenceHtml(f.evidence || [])}</div>`).join("")}</div>`).join("") : `<p class="empty">No rules in scope.</p>`}</section>
    ${(r.conflicts || []).length ? `<section><h2>Source conflicts</h2><p>${r.conflicts.length} pair(s) of claims disagree in the evidence graph; see the timeline for values.</p></section>` : ""}
    <p class="disclaimer">${esc(r.disclaimer)} Run ${esc(r.run_id)}.</p>`;
  renderTimeline(r.events || []);
  const models = r.model_trace || [];
  $("models").innerHTML = models.length ? `<table><thead><tr><th>Role</th><th>Model</th><th>Receipt</th><th>ms</th></tr></thead><tbody>${models.map((t) =>
    `<tr><td>${esc(t.role)}</td><td>${esc((t.model || "").replace("nvidia/", ""))}${t.escalated_from ? " ↑" : ""}</td><td>${esc(t.receipt_id)}</td><td>${esc(t.latency_ms)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No model calls.</p>`;
  const data = r.data_trace || [];
  $("data").innerHTML = data.length ? `<table><thead><tr><th>Backend</th><th>Status</th><th>Rows</th></tr></thead><tbody>${data.map((t) =>
    `<tr><td>${esc(t.backend)}</td><td>${esc(t.status)}</td><td>${esc(t.rows ?? t.error ?? "")}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No queries.</p>`;
}

async function poll(runId) {
  const started = Date.now();
  for (;;) {
    const s = await (await fetch(`/runs/${runId}`)).json();
    renderTimeline(s.events);
    $("run-status").textContent = s.status === "running" ? `Running · ${Math.round((Date.now() - started) / 1000)} s · ${s.events.length} step(s)` : "";
    if (s.status === "done") { renderReport(s.report); return; }
    if (s.status === "error") { $("report").innerHTML = `<p class="empty">Run failed: ${esc(s.error)}</p>`; return; }
    await new Promise((res) => setTimeout(res, 1500));
  }
}

$("run-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const permits = $("permits").value;
  const body = {address: $("address").value, mw: Number($("mw").value), permits_submitted: permits === "" ? null : permits === "yes"};
  $("run-btn").disabled = true;
  $("report").innerHTML = `<p class="empty">Agents are working. The timeline on the right updates as each role finishes.</p>`;
  $("timeline").innerHTML = "";
  try {
    const res = await fetch("/runs", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    await poll(data.run_id);
  } catch (err) {
    $("report").innerHTML = `<p class="empty">Could not start the run: ${esc(err.message)}</p>`;
  } finally { $("run-btn").disabled = false; $("run-status").textContent = ""; }
});

$("sample").addEventListener("change", async () => {
  const name = $("sample").value;
  if (!name) return;
  renderReport(await (await fetch(`/samples/${encodeURIComponent(name)}`)).json());
});

fetch("/samples").then((r) => r.json()).then((list) => {
  $("sample").insertAdjacentHTML("beforeend", list.map((s) =>
    `<option value="${esc(s.name)}">${esc(s.address)} · ${esc(s.mw)} MW · ${esc(VERDICT_TEXT[s.verdict] || s.verdict)}</option>`).join(""));
});
</script>
</body>
</html>
